<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drum Kit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="title">Drum Kit</h1>
    <p>Press a key or tap a drum.</p>
  </header>

  <main class="kit">
    <button class="drum tom" data-key="w"><span class="letter">w</span><span class="name">Tom 1</span></button>
    <button class="drum tom" data-key="a"><span class="letter">a</span><span class="name">Tom 2</span></button>
    <button class="drum tom" data-key="s"><span class="letter">s</span><span class="name">Tom 3</span></button>
    <button class="drum tom" data-key="d"><span class="letter">d</span><span class="name">Tom 4</span></button>
    <button class="drum snare" data-key="j"><span class="letter">j</span><span class="name">Snare</span></button>
    <button class="drum crash" data-key="k"><span class="letter">k</span><span class="name">Crash</span></button>
    <button class="drum kick" data-key="l"><span class="letter">l</span><span class="name">Kick</span></button>
  </main>

  <footer>Made with HTML, CSS and JavaScript</footer>
  <script src="index.js"></script>
</body>
</html>
